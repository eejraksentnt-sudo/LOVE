<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아빠, 생일 축하해!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage">
  <!-- 1~3장: 케이크와 문구 -->
  <section id="s12" class="abs">
    <div id="amb" class="abs"></div>
    <div id="deco" class="abs"></div>
    <div id="title"><div id="l1" class="l1 stroke"></div><div id="l2" class="l2 stroke"></div></div>
    <div id="cake">
      <svg viewBox="0 0 200 190" aria-label="초콜릿 케이크">
        <defs>
          <linearGradient id="gB1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#936a49"/><stop offset="1" stop-color="#58391f"/></linearGradient>
          <linearGradient id="gB2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6041"/><stop offset="1" stop-color="#4e321d"/></linearGradient>
          <linearGradient id="gCr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbe9df"/></linearGradient>
          <radialGradient id="gCh" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ff7a90"/><stop offset=".55" stop-color="#d81f3a"/><stop offset="1" stop-color="#9c1027"/></radialGradient>
        </defs>
        <ellipse cx="100" cy="178" rx="94" ry="9" fill="#fff" opacity=".7"/>
        <g id="l1c" class="part l1c">
          <rect x="18" y="118" width="164" height="58" rx="14" fill="url(#gB1)"/>
          <rect x="18" y="118" width="164" height="14" rx="7" fill="#8d6444"/>
          <rect x="30" y="150" width="140" height="4" rx="2" fill="#5e3f28" opacity=".6"/>
        </g>
        <g id="l2c" class="part l2c">
          <rect x="44" y="74" width="112" height="48" rx="12" fill="url(#gB2)"/>
          <rect x="44" y="74" width="112" height="12" rx="6" fill="#855c3d"/>
        </g>
        <g id="cream" class="part cream" fill="url(#gCr)" stroke="#f0e1d0" stroke-width="1.5">
          <rect x="38" y="60" width="124" height="22" rx="11"/>
          <rect x="46" y="72" width="12" height="30" rx="6"/>
          <rect x="68" y="72" width="11" height="17" rx="5.5"/>
          <rect x="92" y="72" width="15" height="39" rx="7.5"/>
          <rect x="120" y="72" width="12" height="23" rx="6"/>
          <rect x="145" y="72" width="10" height="13" rx="5"/>
        </g>
        <g id="cherry" class="part cherry">
          <path d="M100 38 Q103 24 115 18" stroke="#4a7a35" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="100" cy="50" r="14" fill="url(#gCh)"/>
          <ellipse cx="94" cy="44" rx="4.5" ry="3" fill="#fff" opacity=".75"/>
        </g>
      </svg>
    </div>
  </section>

  <!-- 4장: 비둘기와 편지 -->
  <section id="s4" class="abs" hidden>
    <div id="trail" class="abs"></div>
    <div id="pigeon">
      <svg viewBox="0 0 160 100">
        <polygon points="30,50 0,38 4,58 0,72 32,62" fill="#f4eee8" stroke="#e3d6c8"/>
        <ellipse cx="70" cy="55" rx="42" ry="26" fill="#fff" stroke="#e3d6c8" stroke-width="2"/>
        <circle cx="114" cy="38" r="16" fill="#fff" stroke="#e3d6c8" stroke-width="2"/>
        <polygon points="128,35 143,41 128,46" fill="#f2b36b"/>
        <circle cx="119" cy="34" r="2.4" fill="#755034"/>
        <ellipse cx="124" cy="43" rx="4" ry="2.5" fill="#F5BFCB" opacity=".8"/>
        <g id="mini"><rect x="127" y="46" width="24" height="16" rx="2" fill="#ecd9b8" stroke="#c9b18a"/><path d="M127 46 L139 55 L151 46" fill="none" stroke="#c9b18a"/><text x="139" y="60" font-size="8" text-anchor="middle" fill="#e0314b">♥</text></g>
        <g class="wing"><path d="M40 52 Q70 8 104 46 Q80 70 40 52Z" fill="#f6f1ec" stroke="#e3d6c8" stroke-width="2"/></g>
      </svg>
    </div>
    <div id="envWrap">
      <button id="env" type="button" aria-label="편지 열기">
        <span class="eb"></span>
        <span class="paper"></span>
        <span class="ef"></span>
        <span class="flap"></span>
        <span class="heart">♥</span>
      </button>
    </div>
    <div id="hint">편지를 눌러보세요</div>
    <div id="fx" class="abs"></div>
  </section>

  <!-- 5장: 편지 -->
  <section id="s5" class="abs" hidden>
    <div id="hearts" class="abs"></div>
    <div id="sheetWrap">
      <div class="sheet">
        <div class="top" id="top">A LETTER FOR DAD ♡</div>
        <div class="to" id="to">To. 아빠에게</div>
        <div id="body" tabindex="0" aria-live="off"></div>
        <div class="from" id="from">From. 딸랑이 ♡
          <svg viewBox="0 0 24 24" width="1.3em" height="1.3em"><path id="hd" d="M12 21 C3 14 2 8 6 5.5 C9 3.8 11.5 5.5 12 8 C12.5 5.5 15 3.8 18 5.5 C22 8 21 14 12 21Z" fill="none" stroke="#e0314b" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
